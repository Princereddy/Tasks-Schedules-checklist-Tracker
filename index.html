    <script>
      // Shim to ensure window.fetch is writable and does not throw 'Cannot set property fetch of #<Window> which has only a getter'
      (function() {
        try {
          var win = typeof window !== 'undefined' ? window : globalThis;
          if (win) {
            var _fetch = win.fetch ? win.fetch.bind(win) : undefined;
            Object.defineProperty(win, 'fetch', {
              get: function() {
                return _fetch;
              },
              set: function(fn) {
                _fetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Graceful fallback if property cannot be redefined
        }
      })();
    </script>
